---
# Tags and releases on a version bump. Nothing here bumps the version: the flow
# is to change `__version__` in src/bigfix_actionscript_runner/__init__.py in a
# PR, merge it to main, and this workflow does the rest: build, sign, tag,
# GitHub Release, and - once deliberately enabled, see the publish job - PyPI.
#
# Every release is verifiable three ways, the same as jgstew/uv-audit-cooldown:
#   1. SHA256SUMS.txt (a release asset, and in the notes): `sha256sum -c`
#   2. a GitHub artifact attestation, with its Sigstore bundle as a release
#      asset: `gh attestation verify <file> --repo jgstew/bigfix-actionscript-runner`
#   3. PEP 740 attestations on PyPI, shown as provenance on each file
#
# version -> test + pre-commit -> build -> attest -> release -> publish -> finalize
name: Tag and Release

on:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - ".github/workflows/tag_and_release.yaml"
      - ".github/workflows/test.yaml"
  # a re-run path for when a release run failed after the version was already
  # merged; the tag check below still makes it a no-op if the tag exists
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # deliberately no cancel-in-progress: never kill a release mid-flight
  group: release-${{ github.ref }}

jobs:
  # Decides whether there is anything to do, so the expensive jobs below can be
  # skipped outright. A push that touches src/** without bumping the version
  # gets a green, near-instant run and no release.
  version:
    name: Check for an untagged version
    runs-on: ubuntu-latest
    # fork guard: a fork that pushes to its own main should not try to release.
    # The ref check keeps a workflow_dispatch from another branch from tagging:
    # the `pypi` environment's branch policy now gates only the publish job.
    if: github.repository == 'jgstew/bigfix-actionscript-runner' && github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.getversion.outputs.version }}
      release_needed: ${{ steps.tagged.outputs.release_needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # full history + tags: the tag check below needs every existing tag
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # `__version__` in the package's __init__.py is the single source of
      # truth; pyproject.toml reads it from there via [tool.hatch.version].
      # Importing the package runs only __init__.py, which imports nothing, so
      # the runner's preinstalled python is enough with no install step.
      # Only MAJOR.MINOR.PATCH, without leading zeros: already PEP 440 normal
      # form, so the tag and the PyPI version match. tests/unit/test_version.py
      # pins the same format.
      - name: Read version from __init__.py
        id: getversion
        run: |
          version="$(PYTHONPATH=src python3 -c 'from bigfix_actionscript_runner import __version__; print(__version__)')"
          if ! printf '%s' "$version" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::unexpected version string in src/bigfix_actionscript_runner/__init__.py: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version: $version"

      # PyPI rejects packages with direct URL (git) dependencies, such as
      # pre-commit-bigfix until it is published. Fail here, before a tag or a
      # GitHub release exists, rather than at the publish step after them.
      - name: Refuse to publish what PyPI would reject
        if: vars.PYPI_PUBLISH == 'true'
        run: |
          if python3 -c 'import pathlib, sys, tomllib; deps = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["dependencies"]; sys.exit(any(" @ " in d for d in deps))'; then
            echo "no direct URL dependencies"
          else
            echo "::error::pyproject.toml has a direct URL dependency, which PyPI rejects; unset PYPI_PUBLISH or publish that dependency first"
            exit 1
          fi

      # Release only if this version has no tag yet. This is what makes the
      # workflow idempotent and safe to re-run.
      - name: Check whether v<version> is already tagged
        id: tagged
        env:
          VERSION: ${{ steps.getversion.outputs.version }}
        run: |
          if git show-ref --tags --verify --quiet -- "refs/tags/v${VERSION}"; then
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            echo "v${VERSION} is already tagged - nothing to release"
          else
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
            echo "v${VERSION} has no tag yet - will release"
          fi

  # The gates. Reusing the test and pre-commit workflows means the release is
  # blocked by the exact same jobs that guard PRs, with no third-party
  # wait-for-checks action and no polling. Branch protection alone isn't
  # enough: a direct push to main skips it, and v0.2.1 went out that way with
  # pre-commit failing.
  test:
    name: Test
    needs: version
    if: needs.version.outputs.release_needed == 'true'
    uses: ./.github/workflows/test.yaml # zizmor: ignore[self-repository] -- ./ is the documented local reusable-workflow form

  # The whole tree, not the pushed diff: a failure left by an earlier commit
  # that didn't bump the version must still block the release that follows.
  pre-commit:
    name: pre-commit
    needs: version
    if: needs.version.outputs.release_needed == 'true'
    uses: ./.github/workflows/pre-commit.yaml # zizmor: ignore[self-repository] -- ./ is the documented local reusable-workflow form
    with:
      all-files: true

  # No write permissions and no OIDC token: build code (the hatchling backend,
  # anything it pulls in) never runs next to a credential. Everything after
  # this works on the uploaded dist/ artifact and runs no build code.
  build:
    name: Build
    needs: [version, test, pre-commit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # same awk-from-.pre-commit-config.yaml source of truth as
      # .github/workflows/pre-commit.yaml
      - name: read uv version from .pre-commit-config.yaml
        run: |
          UV_VERSION="$(awk '
            /^[[:space:]]*-[[:space:]]*repo:.*astral-sh\/uv-pre-commit[[:space:]]*$/ { found = 1; next }
            found && $1 == "rev:" {
              if (match($0, /#[ \t]*(frozen:[ \t]*)?[vV]?[0-9]+(\.[0-9]+)*/)) {
                ver = substr($0, RSTART, RLENGTH)
                sub(/^#[ \t]*(frozen:[ \t]*)?[vV]?/, "", ver)
              } else {
                ver = $2
                gsub(/["'\'']/, "", ver)
                sub(/^[vV]/, "", ver)
              }
              print ver
              exit
            }
          ' .pre-commit-config.yaml)"
          if [ -z "$UV_VERSION" ]; then
            echo "::error::could not read the astral-sh/uv-pre-commit version from .pre-commit-config.yaml"
            exit 1
          fi
          echo "UV_VERSION=$UV_VERSION" >> "$GITHUB_ENV"
          echo "uv version: $UV_VERSION"

      - name: install uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: uv build (wheel + sdist)
        run: uv build

      # `sha256sum -c SHA256SUMS.txt`-verifiable, and with no dist/ prefix in
      # it, so it checks out wherever the assets are downloaded to. Globs are
      # listed explicitly rather than `./*` so the output file can never end up
      # listing itself.
      - name: Compute SHA-256 checksums
        working-directory: dist
        run: |
          sha256sum ./*.whl ./*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Signs what build made. It holds an OIDC token (for Sigstore's keyless
  # signing) but checks nothing out and runs no build code.
  attest:
    name: Attest build provenance
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      # <dist name>-<version>.sigstore.json is the release asset Scorecard and
      # `sigstore verify` look for; the action's own bundle path is a temp file
      - name: Name the Sigstore bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir sigstore
          cp "$BUNDLE" "sigstore/bigfix_actionscript_runner-${VERSION}.sigstore.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sigstore
          path: sigstore/
          if-no-files-found: error

  release:
    name: Tag and Release
    needs: [version, build, attest]
    runs-on: ubuntu-latest
    permissions:
      # create the tag and the draft release, and upload its assets
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sigstore
          path: sigstore/

      # Fail before anything is public if the files don't match what attest
      # signed, or the bundle doesn't verify against this repository.
      - name: Verify the attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for file in dist/*.whl dist/*.tar.gz; do
            gh attestation verify "$file" --repo "${GITHUB_REPOSITORY}" --bundle sigstore/*.sigstore.json
          done

      # Release notes: GitHub's own generated notes (same content the Releases
      # UI would produce) with the checksums and the provenance check appended,
      # so both are readable in the release body as well as downloadable as
      # assets. The notes are built here instead of passing --generate-notes to
      # `gh release create` so the appended block is not at the mercy of how
      # that flag combines with --notes.
      - name: Build release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          notes_file="${RUNNER_TEMP}/release-notes.md"
          if ! gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
                --method POST \
                -f "tag_name=v${VERSION}" \
                -f "target_commitish=${GITHUB_SHA}" \
                --jq '.body' > "$notes_file"; then
            echo "::warning::could not generate release notes; falling back to a plain body"
            printf 'Release v%s\n' "${VERSION}" > "$notes_file"
          fi
          # SC2016 fires on the backticks below, but they are markdown code
          # spans destined for the release body, not command substitutions --
          # single quotes are what keeps them literal. The suggested fix
          # (double quotes) would mean escaping every one of them for no gain.
          # Scoped to this group so the rest of the script keeps the check.
          # shellcheck disable=SC2016
          {
            printf '\n## SHA-256\n\n'
            printf 'Verify with `sha256sum -c SHA256SUMS.txt`:\n\n'
            printf '```\n'
            cat dist/SHA256SUMS.txt
            printf '```\n'
            printf '\n## Provenance\n\n'
            printf 'Verify with `gh attestation verify <file> --repo %s`.\n' "${GITHUB_REPOSITORY}"
          } >> "$notes_file"
          echo "NOTES_FILE=$notes_file" >> "$GITHUB_ENV"
          cat "$notes_file"

      # A draft release does not create its tag, so tag first, through the API:
      # no git push, and no checkout, so nothing here can run repo code.
      - name: Create the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" --method POST \
            -f "ref=refs/tags/v${VERSION}" -f "sha=${GITHUB_SHA}"

      # A draft, so every asset is attached before the release is public (and,
      # with immutable releases, locked). finalize publishes it once PyPI has
      # the same files. No checkout, so the repo is named explicitly.
      - name: Create the draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft \
            --title "v${VERSION}" \
            --notes-file "${NOTES_FILE}" \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt sigstore/*.sigstore.json

  # Inert until all of these are true, so nothing can publish by accident:
  #   1. a PyPI trusted publisher exists for this repo with workflow name
  #      `tag_and_release.yaml` and environment name `pypi`, matching the
  #      `environment:` below (https://docs.pypi.org/trusted-publishers/)
  #   2. the repository variable PYPI_PUBLISH is set to `true`
  #      (Settings > Secrets and variables > Actions > Variables)
  #   3. whatever protection rules the `pypi` environment carries have been
  #      satisfied - those gate only this job; the tag and the draft release
  #      already exist by now
  publish:
    name: Publish to PyPI
    needs: release
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    # The name must match the `Environment name` field of the PyPI trusted
    # publisher exactly: PyPI checks the `environment` claim in the OIDC token,
    # and a mismatch fails the publish.
    environment: pypi
    permissions:
      # OIDC for trusted publishing and for signing the PEP 740 attestations
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # the action uploads everything in packages-dir; PyPI takes only the
      # wheel and the sdist
      - name: Drop the checksums file
        run: rm dist/SHA256SUMS.txt

      # The same files the GitHub release carries, plus PEP 740 attestations,
      # which `uv publish` doesn't generate (astral-sh/uv#15618) - the reason
      # this is the pypa action and not uv.
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true

  # Last: if PyPI fails, the release stays a draft, so nothing public points at
  # files PyPI doesn't have. Fix the cause and release a new version.
  finalize:
    name: Publish the GitHub release
    needs: [version, release, publish]
    # publish is skipped while PYPI_PUBLISH is unset, and a skipped need would
    # otherwise skip this job too
    if: >-
      !cancelled() && needs.release.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.publish.result)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release edit "v${VERSION}" --repo "${GITHUB_REPOSITORY}" --draft=false
