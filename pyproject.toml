[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bigfix-actionscript-runner"
dynamic = ["version"]
description = "Run BigFix ActionScript from a .bes file the way a client would: real client relevance substitution via qna, locally or over SSH, with the client folders sandboxed."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "JGStew", email = "admin@jgstew.com" },
]
requires-python = ">=3.11"
keywords = ["bigfix", "actionscript", "qna", "client-relevance", "ssh", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
dependencies = [
  "asyncssh>=2.14",
  "bigfix-prefetch>=1.1.5,<2",
  "bigfix-relevance-analyzer>=1.38,<2",
  "bigfix-remote-client-relevance>=1.6.2,<2",
  "platformdirs>=4",
  "pre-commit-bigfix>=2.0.1,<3",
  "requests>=2.31",
  "typer>=0.12",
]

# Dev tooling lives in a PEP 735 dependency group, which `uv sync` installs by
# default — an optional-dependencies extra would need `--extra dev` every time.
[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-xdist>=3.8.0",
  "pyright>=1.1.400",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-requests",
]

[project.scripts]
bigfix-actionscript-runner = "bigfix_actionscript_runner.cli:main"

[project.urls]
Homepage = "https://github.com/jgstew/bigfix-actionscript-runner"
Issues   = "https://github.com/jgstew/bigfix-actionscript-runner/issues"
Source   = "https://github.com/jgstew/bigfix-actionscript-runner"

# --- Build backend ---------------------------------------------------------

# `__version__` is the single source of truth: bump it there, and the build
# and tag_and_release.yaml both read it from that file.
[tool.hatch.version]
path = "src/bigfix_actionscript_runner/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bigfix_actionscript_runner"]

# Only what's needed to build and test: without this the sdist carries every
# file git doesn't ignore (agent docs, CI config, lockfile, dotfiles).
[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

# --- uv --------------------------------------------------------------------

[tool.uv]
python-preference = "managed"
# uv reinstalls the editable project only when a cache key changes, and the
# default keys don't include the file the version now lives in; without it, a
# bump would leave the installed metadata on the old version until a manual
# `uv sync --reinstall-package`.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/bigfix_actionscript_runner/__init__.py" }]
# Supply-chain quarantine: ignore any distribution uploaded in the last 7
# days, same as bigfix-remote-client-relevance. Overridable per run
# (`--exclude-newer`) or per package (`exclude-newer-package`).
exclude-newer = "-P7D"
# Sibling packages by the same maintainer released inside the window. The
# fixed date lifts the quarantine for those releases only; remove each once
# the rolling window has passed it (after 2026-10-29; pre-commit-bigfix after
# 2026-10-30), or it would hold the package back from then on.
# certifi 2026.10.19 fixes GHSA-6q48-6c7w-9gw2 (compromised emSign CAs), a
# security fix worth taking before the window passes; same removal date.
exclude-newer-package = { bigfix-remote-client-relevance = "2026-10-22T00:00:00Z", bigfix-remote-session-relevance = "2026-10-22T00:00:00Z", bigfix-relevance-analyzer = "2026-10-22T00:00:00Z", certifi = "2026-10-22T00:00:00Z", pre-commit-bigfix = "2026-10-23T02:00:00Z" }

# --- Tooling ---------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests are isolated (per-test tmp_path), so fanning out across workers is safe.
addopts = "-n auto"
# Everything unmarked runs offline on a bare machine. Marked tests need a real
# prerequisite and are auto-skipped by tests/conftest.py when it is absent.
markers = [
  "live_qna: needs a real local qna binary (root on macOS: sudo -E uv run pytest -m live_qna)",
  "ssh_posix: needs a real macOS/Linux SSH target (set BFASR_SSH_POSIX_HOST=user@host)",
  "ssh_windows: needs a real Windows SSH target (set BFASR_SSH_WINDOWS_HOST=user@host)",
  "network: downloads from the internet (opt in with BFASR_NETWORK_TESTS=1)",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# T20 (flake8-print): stdout belongs to cli.py (the trace or the --json
# payload); everything else logs.
extend-select = ["T20", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/bigfix_actionscript_runner/cli.py" = ["T20"]

[tool.mypy]
python_version = "3.11"
strict = true

# None of these ship type information.
[[tool.mypy.overrides]]
module = ["bigfix_prefetch.*", "pre_commit_bigfix.*", "bigfix_relevance_analyzer.*"]
ignore_missing_imports = true
